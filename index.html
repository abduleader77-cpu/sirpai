<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIR P Ai</title>
<meta name="theme-color" content="#14301f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#e9efe9;--ink:#14301f;--me:#14301f;--me-ink:#f4f8f4;--bot:#ffffff;--accent:#f2a900;--muted:#5d7566}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  header{padding:10px 14px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px}
  header img{width:34px;height:34px;border-radius:9px}
  header h1{font-size:1.15rem;margin:0;flex:1}
  .hbtn{background:none;border:1px solid var(--ink);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;padding:10px 14px;border-radius:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
  .me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:3px;white-space:pre-wrap}
  .bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:3px}
  .bot .text p{margin:0 0 .7em}
  .bot .text>*:last-child{margin-bottom:0}
  .bot h3,.bot h4{margin:.9em 0 .4em;font-size:1.05rem}
  .bot ul,.bot ol{margin:0 0 .7em;padding-left:1.3em}
  .bot hr{border:none;border-top:1px solid #c9d6cc;margin:.9em 0}
  .bot code{background:#eef3ee;border-radius:4px;padding:1px 5px;font-family:Menlo,Consolas,monospace;font-size:.88em}
  .bot pre{background:#eef3ee;border-radius:8px;padding:10px;overflow-x:auto;margin:0 0 .7em}
  .bot pre code{background:none;padding:0}
  .tablewrap{overflow-x:auto;margin:0 0 .7em}
  .bot table{border-collapse:collapse;font-size:.9rem}
  .bot th,.bot td{border:1px solid #c9d6cc;padding:5px 8px;text-align:left}
  .bot th{background:#eef3ee}
  .copy{margin-top:8px;background:none;border:1px solid var(--muted);color:var(--muted);border-radius:6px;padding:3px 9px;font:inherit;font-size:.78rem;cursor:pointer}
  .copy.done{color:var(--ink);border-color:var(--ink)}
  .err{align-self:center;color:#9b2c1d;font-size:.9rem;text-align:center}
  .empty{margin:auto;text-align:center;color:var(--muted)}
  .empty img{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 12px}
  .tools{display:flex;gap:8px;align-items:center;padding:8px 12px 0}
  #think{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
  #think[aria-pressed="true"]{background:var(--ink);color:var(--me-ink)}
  form{display:flex;gap:8px;padding:8px 12px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  textarea{flex:1;resize:none;border:1px solid var(--ink);border-radius:10px;padding:10px;font:inherit;max-height:120px;background:#fff;color:var(--ink)}
  #send{background:var(--accent);color:var(--ink);border:none;border-radius:10px;padding:0 18px;font:inherit;font-weight:bold}
  #send:disabled{opacity:.5}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 0}
  .chip{background:#fff;border:1px solid var(--ink);border-radius:999px;padding:3px 6px 3px 10px;font-size:.8rem;display:flex;gap:4px;align-items:center;max-width:100%}
  .chip button{border:none;background:none;font:inherit;color:#9b2c1d;cursor:pointer;padding:0 4px}
  #attach{padding:0 14px;font-size:1.4rem;line-height:1}
  .me img{max-width:160px;max-height:160px;border-radius:8px;display:block;margin-bottom:6px}
  .me .att{font-size:.8rem;opacity:.85;margin-top:4px}
  #panel{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px)}
  #panel.open{display:flex}
  #panel header h2{font-size:1.15rem;margin:0;flex:1}
  #list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:6px}
  .row .open{flex:1;text-align:left;background:#fff;border:1px solid var(--ink);border-radius:10px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .del{background:none;border:1px solid #9b2c1d;color:#9b2c1d;border-radius:10px;padding:0 12px;font:inherit;cursor:pointer}
  .none{margin:auto;color:var(--muted)}
</style>
</head>

/* ---------- simple formatting (bold, headings, lists, code, tables) ---------- */
function md(src){
  const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const blocks = [];
  src = src.replace(/```[\w-]*\n?([\s\S]*?)```/g, (m, c) => {
    blocks.push("<pre><code>" + esc(c.replace(/\n$/, "")) + "</code></pre>");
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  const inl = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  const out = []; let para = [], listType = null, table = [];
  const fp = () => { if (para.length) { out.push("<p>" + para.map(inl).join("<br>") + "</p>"); para = []; } };
  const fl = () => { if (listType) { out.push("</" + listType + ">"); listType = null; } };
  const ft = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r) || !/-/.test(r));
    const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inl(c.trim()));
    let h = '<div class="tablewrap"><table>';
    rows.forEach((r, i) => {
      const tag = i === 0 ? "th" : "td";
      h += "<tr>" + cells(r).map((c) => "<" + tag + ">" + c + "</" + tag + ">").join("") + "</tr>";
    });
    out.push(h + "</table></div>"); table = [];
  };
  for (const line of src.split("\n")) {
    const t = line.trim();
    if (t.startsWith("|")) { fp(); fl(); table.push(line); continue; } else ft();
    let m;
    if ((m = t.match(/^\u0000(\d+)\u0000$/))) { fp(); fl(); out.push(blocks[+m[1]]); }
    else if ((m = t.match(/^(#{1,6})\s+(.*)$/))) { fp(); fl(); out.push("<h" + (m[1].length <= 2 ? 3 : 4) + ">" + inl(m[2]) + "</h" + (m[1].length <= 2 ? 3 : 4) + ">"); }
    else if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { fp(); fl(); out.push("<hr>"); }
    else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { fp(); if (listType !== "ul") { fl(); out.push("<ul>"); listType = "ul"; } out.push("<li>" + inl(m[1]) + "</li>"); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { fp(); if (listType !== "ol") { fl(); out.push("<ol>"); listType = "ol"; } out.push("<li>" + inl(m[1]) + "</li>"); }
    else if (t === "") { fp(); fl(); }
    else { fl(); para.push(t); }
  }
  fp(); fl(); ft();
  return out.join("");
}

/* ---------- chat screen ---------- */
function showEmpty(){
  chat.innerHTML = '<div class="empty" id="empty"><img src="' + LOGO + '" alt="">Hello, I am SIR P Ai. Ask me anything.</div>';
}
function clearEmpty(){ const e = document.getElementById("empty"); if (e) e.remove(); }

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    return ok;
  }
}
function addCopy(bubble, text){
  const b = document.createElement("button");
  b.className = "copy"; b.type = "button"; b.textContent = "Copy answer";
  b.addEventListener("click", async () => {
    const ok = await copyText(text);
    b.textContent = ok ? "Copied" : "Copy failed";
    b.classList.add("done");
    setTimeout(() => { b.textContent = "Copy answer"; b.classList.remove("done"); }, 1500);
  });
  bubble.appendChild(b);
}
function addMsg(role, text, extra){
  clearEmpty();
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : role === "err" ? "err" : "bot");
  if (role === "user" && extra && extra.files) {
    extra.files.filter((f) => f.mime.startsWith("image/")).forEach((f) => {
      const im = document.createElement("img");
      im.src = "data:" + f.mime + ";base64," + f.data; im.alt = f.name;
      d.appendChild(im);
    });
  }
  const t = document.createElement("div");
  t.className = "text";
  if (role === "model") t.innerHTML = md(text); else t.textContent = text;
  d.appendChild(t);
  if (role === "user" && extra && extra.names && extra.names.length) {
    const a = document.createElement("div");
    a.className = "att";
    a.textContent = "Attached: " + extra.names.join(", ");
    d.appendChild(a);
  }
  if (role === "model") addCopy(d, text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function renderChat(){
  chat.innerHTML = "";
  if (!cur.messages.length) { showEmpty(); return; }
  cur.messages.forEach((m) => addMsg(m.role, m.text, m));
}

let pending = [];

const TEXT_EXT = /\.(txt|md|csv|tsv|json|js|ts|py|html|css|xml|log|java|c|cpp|h|cs|go|rs|php|rb|sql|yml|yaml|ini|sh)$/i;

function drawChips(){
  chips.innerHTML = "";
  pending.forEach((p, i) => {
    const c = document.createElement("div"); c.className = "chip"; c.textContent = p.name;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "\u2715";
    x.setAttribute("aria-label", "Remove " + p.name);
    x.addEventListener("click", () => { pending.splice(i, 1); drawChips(); });
    c.appendChild(x); chips.appendChild(c);
  });
}
function readB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(new Error("Could not read the file"));
    r.readAsDataURL(file);
  });
}
function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Could not open this picture")); };
    img.src = url;
  });
}
fileInput.addEventListener("change", async () => {
  for (const f of Array.from(fileInput.files)) {
    if (pending.length >= 4) { addMsg("err", "You can attach up to 4 files at a time."); break; }
    try {
      if (f.type.startsWith("image/")) {
        pending.push({ name: f.name, files: { name: f.name, mime: "image/jpeg", data: await shrinkImage(f) } });
      } else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
        if (f.size > 10 * 1024 * 1024) throw new Error("This PDF is bigger than 10 MB");
        pending.push({ name: f.name, files: { name: f.name, mime: "application/pdf", data: await readB64(f) } });
      } else if (f.type.startsWith("text/") || TEXT_EXT.test(f.name)) {
        pending.push({ name: f.name, textFile: { name: f.name, content: (await f.text()).slice(0, 150000) } });
      } else {
        throw new Error("This file type is not supported yet");
      }
    } catch (e) { addMsg("err", f.name + ": " + e.message); }
  }
  fileInput.value = ""; drawChips();
});

/* ---------- send ---------- */
function buildPayload(){
  const withFiles = [];
  cur.messages.forEach((m, i) => { if (m.files && m.files.length) withFiles.push(i); });
  const keep = new Set(withFiles.slice(-3));
  return cur.messages.map((m, i) => {
    let text = m.text;
    (m.textFiles || []).forEach((f) => { text += "\n\n[File: " + f.name + "]\n" + f.content; });
    const out = { role: m.role };
    if (keep.has(i)) out.files = m.files;
    else if (m.names && m.names.length && !(m.textFiles && m.textFiles.length)) {
      text += "\n\n[Attached earlier: " + m.names.join(", ") + " - the file content is not available now]";
    }
    out.text = text;
    return out;
  });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  let text = input.value.trim();
  if (!text && !pending.length) return;
  if (!text) text = "Please read the attached file(s) and tell me what is in them.";
  input.value = "";
  const msg = {
    role: "user", text,
    names: pending.map((p) => p.name),
    files: pending.filter((p) => p.files).map((p) => p.files),
    textFiles: pending.filter((p) => p.textFile).map((p) => p.textFile)
  };
  pending = []; drawChips();
  addMsg("user", text, msg);
  cur.messages.push(msg);
  send.disabled = true;
  const wait = addMsg("wait", think ? "Thinking\u2026" : "\u2026");
  wait.className = "msg bot";
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: buildPayload(), think })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    wait.remove();
    cur.messages.push({ role: "model", text: data.reply });
    addMsg("model", data.reply);
    if (cur.messages.length === 2) cur.title = (msg.names[0] && text.startsWith("Please read the attached") ? msg.names[0] : text).slice(0, 40);
    cur.updated = Date.now();
    if (!chats.includes(cur)) chats.unshift(cur);
    saveChats();
  } catch (err) {
    wait.remove();
    cur.messages.pop();
    addMsg("err", "Could not get a reply: " + err.message + ". Try again.");
  }
  send.disabled = false;
  chat.scrollTop = chat.scrollHeight;
  input.focus();
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) {
    e.preventDefault();
    form.requestSubmit();
  }
});

/* ---------- history screen ---------- */
function buildList(){
  list.innerHTML = "";
  if (!chats.length) { list.innerHTML = '<div class="none">No saved chats yet.</div>'; return; }
  [...chats].sort((a, b) => b.updated - a.updated).forEach((c) => {
    const row = document.createElement("div"); row.className = "row";
    const o = document.createElement("button"); o.className = "open"; o.type = "button"; o.textContent = c.title;
    o.addEventListener("click", () => { cur = c; renderChat(); panel.classList.remove("open"); });
    const d = document.createElement("button"); d.className = "del"; d.type = "button"; d.textContent = "Delete";
    d.addEventListener("click", () => {
      chats = chats.filter((x) => x !== c);
      saveChats();
      if (cur === c) newChat();
      buildList();
    });
    row.appendChild(o); row.appendChild(d); list.appendChild(row);
  });
}
document.getElementById("hist").addEventListener("click", () => { buildList(); panel.classList.add("open"); });
document.getElementById("closeHist").addEventListener("click", () => panel.classList.remove("open"));
